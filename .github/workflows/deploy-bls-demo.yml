name: Deploy BLS demo to Cloudflare Pages

# Publishes the pre-built docs/ (index.html + bls.js + bls.wasm) to a separate
# Cloudflare Pages project (bls-demo), served at https://bls.al-am.in/.
# The .wasm is built locally via examples/bls/build_wasm.sh (needs emsdk + GMP);
# this action only ships the committed static assets.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (same as the portfolio repo), and a DNS CNAME bls -> bls-demo.pages.dev.

on:
  workflow_dispatch:
  push:
    branches: [refactor/decouple-field-arithmetic]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-bls-demo.yml"

concurrency:
  group: cloudflare-bls-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=bls-demo
